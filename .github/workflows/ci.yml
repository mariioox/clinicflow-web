name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from "packageManager" in package.json (pnpm/action-setup fails if both are set and differ).
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check Contract Drift
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.d.ts || (echo "Contract drift detected! Generated schema has changed." && exit 1)

      - name: Build
        run: pnpm build
